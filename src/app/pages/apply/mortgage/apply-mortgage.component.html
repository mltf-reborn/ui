<div class="space-y-6 max-w-7xl mx-auto pb-12">

  <!-- Breadcrumb -->
  <app-breadcrumb [pageTitle]="'Mortgage Loan Application'" />

  <!-- ========================================================================= -->
  <!-- HEADER BANNER                                                               -->
  <!-- ========================================================================= -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-6 rounded-2xl bg-gradient-to-r from-brand-600 to-brand-800 text-white shadow-lg">
    <div class="space-y-1">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 text-xs font-semibold backdrop-blur-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        New Application &bull; MLTF Mortgage Financing
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
        Apply for Mortgage Loan
      </h1>
      <p class="text-xs sm:text-sm text-brand-100 max-w-2xl">
        Complete all sections below to submit your mortgage loan application. Our team will review your submission within 3–5 business days.
      </p>
    </div>

    <div class="shrink-0 flex items-center justify-center w-16 h-16 rounded-2xl bg-white/15 backdrop-blur-sm">
      <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
  </div>


  <!-- ========================================================================= -->
  <!-- FORM CONTENT AREA (placeholder — form sections go here)                   -->
  <!-- ========================================================================= -->
  <div class="p-6 rounded-2xl bg-white dark:bg-gray-800/90 border border-gray-200 dark:border-gray-700/80 shadow-sm min-h-[300px] flex flex-col items-center justify-center gap-4 text-center">
    <div class="w-14 h-14 rounded-2xl bg-brand-50 dark:bg-brand-900/40 text-brand-500 dark:text-brand-400 flex items-center justify-center">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </div>
    <div>
      <p class="font-semibold text-gray-700 dark:text-gray-200 text-sm">Form coming soon</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">The application form design will be added here.</p>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- ACTION FOOTER                                                               -->
  <!-- ========================================================================= -->
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-5 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-sm">
    <a
      routerLink="/dashboard"
      class="w-full sm:w-auto px-5 py-2.5 text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition text-center"
    >
      Cancel
    </a>

    <button
      type="button"
      class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-500/20 transition cursor-pointer"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Submit Application</span>
    </button>
  </div>

</div>
